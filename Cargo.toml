[package]
name = "certies"
version = "0.1.1"
edition = "2021"
description = "A command-line tool for managing SSL client certificates and a local Certificate Authority"
license = "MIT"
repository = "https://github.com/torpedro/certies"
homepage = "https://torpedro.github.io/certies/"
readme = "README.md"
keywords = ["ssl", "tls", "certificate", "openssl", "ca"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["docs/"]

[[bin]]
name = "certies"
path = "src/main.rs"

[features]
# Build OpenSSL from source; used by CI on macOS and Windows runners.
vendored-openssl = ["openssl/vendored"]

[dependencies]
anyhow = "1"
# Pinned to 0.1 on purpose: this must match the `foreign-types` version that
# openssl 0.10 uses, so that `ForeignType` applies to openssl's types.
foreign-types-shared = "0.3"
openssl = "0.10"
openssl-sys = "0.9"
rpassword = "7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
serde = { version = "1", features = ["derive"] }
x509-parser = "0.18"
serde_json = "1"
time = "0.3"

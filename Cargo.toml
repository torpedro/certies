[package]
name = "certies"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "certies"
path = "src/main.rs"

[dependencies]
anyhow = "1"
foreign-types-shared = "0.1"
openssl = "0.10"
openssl-sys = "0.9"
rpassword = "7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
serde = { version = "1", features = ["derive"] }
x509-parser = "0.16"
serde_json = "1"
time = "0.3"
